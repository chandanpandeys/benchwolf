name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel in a clean virtual environment
        shell: bash
        run: |
          python -m venv /tmp/benchwolf-smoke
          /tmp/benchwolf-smoke/bin/python -m pip install --upgrade pip
          /tmp/benchwolf-smoke/bin/python -m pip install dist/*.whl
          /tmp/benchwolf-smoke/bin/benchwolf --version
          /tmp/benchwolf-smoke/bin/python - <<'PY'
          from importlib.resources import files
          import benchwolf
          assert (files("benchwolf.data") / "mmlu_mini.json").is_file()
          assert (files("benchwolf.data") / "humaneval_mini.json").is_file()
          print(benchwolf.__version__)
          PY
