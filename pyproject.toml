[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inferbench"
version = "0.1.0"
description = "Inference & Edge AI Benchmark Tool — measure LLM speed, memory, power & quality in one command"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "Chandan Pandey"},
]
keywords = ["ai", "benchmark", "edge", "llm", "inference", "performance", "ollama", "eval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "psutil>=5.9",
    "requests>=2.28",
    "pydantic>=2.0",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.2"]
power = ["pyRAPL>=0.1"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
inferbench = "inferbench.cli:main"

[project.urls]
Homepage = "https://github.com/chandanpandeys/inferbench"
Repository = "https://github.com/chandanpandeys/inferbench"
Issues = "https://github.com/chandanpandeys/inferbench/issues"
Changelog = "https://github.com/chandanpandeys/inferbench/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inferbench = ["data/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
