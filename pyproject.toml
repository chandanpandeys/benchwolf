[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benchwolf"
version = "0.1.0"
description = "Benchmark local LLM throughput, latency, memory pressure, power, and lightweight quality on your own hardware"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Chandan Pandey"}]
keywords = ["ai", "benchmark", "llm", "inference", "ollama", "edge-ai", "performance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "click>=8.1,<9",
    "rich>=13,<15",
    "psutil>=5.9,<8",
    "requests>=2.31,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
llamacpp = ["llama-cpp-python>=0.2"]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
    "twine>=6,<7",
]

[project.scripts]
benchwolf = "benchwolf.cli:main"

[project.urls]
Homepage = "https://github.com/chandanpandeys/inferbench"
Repository = "https://github.com/chandanpandeys/inferbench"
Issues = "https://github.com/chandanpandeys/inferbench/issues"
Changelog = "https://github.com/chandanpandeys/inferbench/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["benchwolf*"]

[tool.setuptools.package-data]
benchwolf = ["data/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
